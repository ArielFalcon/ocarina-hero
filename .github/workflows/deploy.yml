# Builds the static site (no melody server) and publishes it to Cloudflare Pages (ocarinahero.app).
# Requires the CLOUDFLARE_API_TOKEN secret (Account > Cloudflare Pages > Edit) and the
# CLOUDFLARE_ACCOUNT_ID repository variable.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:static
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name ocarina-hero --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
