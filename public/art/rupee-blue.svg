<use href="#rupee-blue-stitch" transform="translate(20.000 120.000) rotate(-90.00000)"/>
<use href="#rupee-blue-stitch" transform="translate(20.000 98.000) rotate(-90.00000)"/>
<use href="#rupee-blue-stitch" transform="translate(20.000 76.000) rotate(-90.00000)"/>
<use href="#rupee-blue-stitch" transform="translate(20.000 54.000) rotate(-90.00000)"/>
